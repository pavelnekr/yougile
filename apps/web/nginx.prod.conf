server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Тот же предел, что UPLOAD_MAX_BYTES в API (по умолчанию 10 МБ), с запасом
    # на multipart-обвязку. Без этой строки действует умолчание nginx в 1 МБ, и
    # файл плана от 1 до 10 МБ отбивался сырым HTML-ответом 413 до API, вместо
    # сообщения приложения. При изменении UPLOAD_MAX_BYTES править и здесь.
    client_max_body_size 12m;

    # Версия nginx в ответах и страницах ошибок не нужна.
    server_tokens off;

    # Заголовки безопасности. В style-src оставлен 'unsafe-inline': React задаёт
    # инлайновые style (полоса прогресса операции через transform), и без этого
    # правила полоса не отрисовалась бы. Внешних шрифтов и скриптов приложение
    # не подключает, поэтому script-src и font-src остаются 'self'.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Proxy API calls to internal API service
    location /api/ {
        proxy_pass http://api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
