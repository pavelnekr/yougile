<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Фирменный знак портала: 2×2 сетка скруглённых плиток с поворотом -8°,
       те же цвета, что у .brand-mark в сайдбаре, но на тёмной подложке,
       чтобы светлые плитки читались на вкладке браузера. -->
  <defs>
    <linearGradient id="brand-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26396f"/>
      <stop offset="1" stop-color="#1b2851"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#brand-bg)"/>
  <g transform="rotate(-8 32 32)">
    <rect x="14" y="14" width="15" height="15" rx="4.5" fill="#4169e1"/>
    <rect x="35" y="14" width="15" height="15" rx="4.5" fill="#b7c6ff"/>
    <rect x="14" y="35" width="15" height="15" rx="4.5" fill="#83a4ee"/>
    <rect x="35" y="35" width="15" height="15" rx="4.5" fill="#d5ddfb"/>
  </g>
</svg>