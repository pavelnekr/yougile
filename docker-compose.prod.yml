# Production-like compose for a single server
# WEB_PORT - внешний порт веба (default 80)
# API_PORT - внешний порт API (optional, можно не выставлять наружу)
services:
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "node_modules/prisma/build/index.js", "migrate", "deploy"]
    restart: "no"
    env_file:
      - .env
    environment:
      # Внутри docker-сети БД доступна по имени сервиса, поэтому DATABASE_URL
      # собирается здесь из POSTGRES_* и НЕ берётся из .env (там для локальной
      # разработки стоит localhost, который внутри контейнера не работает).
      DATABASE_URL: postgresql://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/${POSTGRES_DB:-yougile_portal}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Перекрываем, чтобы работало внутри Docker-сети. DATABASE_URL собирается
      # из POSTGRES_* и НЕ берётся из .env: там localhost для локальной разработки,
      # который внутри контейнера не резолвится. То же для REDIS_URL.
      DATABASE_URL: postgresql://${POSTGRES_USER:-portal}:${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}@postgres:5432/${POSTGRES_DB:-yougile_portal}?schema=public
      REDIS_URL: redis://redis:6379
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost}
      API_PORT: ${API_PORT:-4000}
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Выставлять наружу API не обязательно. Веб проксирует /api через Docker DNS.
    # ports:
    #   - "4000:4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:${API_PORT:-4000}/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # nginx в образе проксирует на host.docker.internal. Для prod-сети заменим конфиг ниже.
      API_HOST: api
      API_PORT: ${API_PORT:-4000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yougile_portal}
      POSTGRES_USER: ${POSTGRES_USER:-portal}
      # Без дефолта: fallback «portal» позволил бы базе подняться с паролем по
      # умолчанию, пока DATABASE_URL в сервисах API уже падает на отсутствии
      # переменной. Пароль обязан быть задан явно.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-portal} -d ${POSTGRES_DB:-yougile_portal}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
